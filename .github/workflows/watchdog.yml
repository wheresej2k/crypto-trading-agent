name: Crypto bot watchdog

on:
  schedule:
    # Hourly at :50, offset from the trading job's :05 and the dashboard refresh's :20 so it
    # isn't checking mid-run. Runs independently of the hourly-trade workflow on purpose - if
    # THAT workflow's schedule silently fails to fire (the exact failure mode that hit the
    # stock bot, and that this bot itself hit once for real on 2026-09-14, ~22:05 UTC, with a
    # single run silently dropped), this one still runs and notices, because it doesn't depend
    # on the same trigger. Checking hourly (not every 3h, the original cadence) is what makes a
    # 2-hour alert threshold (below) actually catchable - a check that only runs every 3 hours
    # can't detect a 2-hour gap in time.
    - cron: "50 * * * *"
  workflow_dispatch: {}

env:
  # Lowered from 3 to 2 hours after a real single-run miss on 2026-09-14 went undetected (the
  # very next hourly run succeeded before 3 hours of silence ever accumulated). 2 hours means
  # roughly "2 consecutive misses" gets caught, not just a sustained multi-hour outage.
  WATCHDOG_ALERT_AFTER_HOURS: "2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install needed - watchdog.py and heartbeat.py only use the Python standard
      # library, deliberately, so this check has as few ways to fail as possible.
      - name: Check for a missed run
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHONE_MMS_ADDRESS: ${{ secrets.PHONE_MMS_ADDRESS }}
        run: python watchdog.py
